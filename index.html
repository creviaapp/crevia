  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="text/babel">
      const { useEffect, useRef, useState } = React;
      const { motion, useAnimationFrame, useMotionTemplate, useMotionValue, useScroll, useSpring, useTransform } = window.Motion;

      const REVEAL_EASE = [0.16, 1, 0.3, 1];
      const REVEAL_TRANSITION = { duration: 0.72, ease: REVEAL_EASE };
      const SECTION_REVEAL = {
        initial: { opacity: 0, y: 30 },
        whileInView: { opacity: 1, y: 0 },
        viewport: { once: true, amount: 0.2 },
        transition: REVEAL_TRANSITION,
      };
      const STAGGER_CONTAINER = {
        hidden: {},
        show: {
          transition: {
            staggerChildren: 0.15,
          },
        },
      };
      const STAGGER_ITEM = {
        hidden: { opacity: 0, y: 30 },
        show: { opacity: 1, y: 0, transition: REVEAL_TRANSITION },
      };

      function MagneticButton({ href, className, children, target, rel }) {
        const x = useMotionValue(0);
        const y = useMotionValue(0);
        const springX = useSpring(x, { stiffness: 280, damping: 26, mass: 0.3 });
        const springY = useSpring(y, { stiffness: 280, damping: 26, mass: 0.3 });

        const handleMouseMove = (event) => {
          const rect = event.currentTarget.getBoundingClientRect();
          const dx = event.clientX - (rect.left + rect.width / 2);
          const dy = event.clientY - (rect.top + rect.height / 2);
          x.set(Math.max(-10, Math.min(10, dx * 0.12)));
          y.set(Math.max(-8, Math.min(8, dy * 0.16)));
        };

        const reset = () => {
          x.set(0);
          y.set(0);
        };

        return (
          <motion.a
            href={href}
            target={target}
            rel={rel}
            style={{ x: springX, y: springY, willChange: 'transform' }}
            whileTap={{ scale: 0.97 }}
            transition={{ type: 'spring', stiffness: 540, damping: 34, mass: 0.5 }}
            onMouseMove={handleMouseMove}
            onMouseLeave={reset}
            className={`premium-button ${className}`}
          >
            {children}
          </motion.a>
        );
      }

      function AnimatedStat({ value, suffix = '', label }) {
        const elementRef = useRef(null);
        const [displayValue, setDisplayValue] = useState(0);
        const [started, setStarted] = useState(false);

        useEffect(() => {
          const observer = new IntersectionObserver(([entry]) => {
            if (entry.isIntersecting) setStarted(true);
          }, { threshold: 0.45 });
          if (elementRef.current) observer.observe(elementRef.current);
          return () => observer.disconnect();
        }, []);

        useEffect(() => {
          if (!started) return;
          const duration = 1350;
          const startTime = performance.now();
          let frame;
          const tick = (now) => {
            const progress = Math.min((now - startTime) / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 4);
            setDisplayValue(Math.round(value * eased));
            if (progress < 1) frame = requestAnimationFrame(tick);
          };
          frame = requestAnimationFrame(tick);
          return () => cancelAnimationFrame(frame);
        }, [started, value]);

        return (
          <div ref={elementRef} className="rounded-2xl border border-white/10 bg-[linear-gradient(180deg,rgba(14,14,14,0.55),rgba(255,255,255,0.02))] p-5 shadow-[0_10px_24px_rgba(0,0,0,0.18)] backdrop-blur-sm">
            <p className="font-display text-5xl leading-none text-white sm:text-7xl">{displayValue.toLocaleString()}{suffix}</p>
            <p className="mt-4 text-[10px] font-bold uppercase tracking-[0.22em] text-white/75">{label}</p>
          </div>
        );
      }

      function SpotlightPanel({ className, children, glowClassName = 'bg-white/[0.1]', hoverLift = false }) {
        const [isHovering, setIsHovering] = useState(false);
        const x = useMotionValue(-200);
        const y = useMotionValue(-200);
        const glowX = useSpring(x, { stiffness: 260, damping: 28, mass: 0.35 });
        const glowY = useSpring(y, { stiffness: 260, damping: 28, mass: 0.35 });

        const onMove = (event) => {
          const rect = event.currentTarget.getBoundingClientRect();
          x.set(event.clientX - rect.left);
          y.set(event.clientY - rect.top);
        };

        return (
          <motion.div
            className={`relative overflow-hidden ${className}`}
            onMouseMove={onMove}
            onMouseEnter={() => setIsHovering(true)}
            onMouseLeave={() => setIsHovering(false)}
            whileHover={hoverLift ? { y: -8, scale: 1.012 } : undefined}
            transition={hoverLift ? { type: 'spring', stiffness: 320, damping: 24, mass: 0.55 } : undefined}
          >
            <motion.div
              className={`pointer-events-none absolute h-56 w-56 -translate-x-1/2 -translate-y-1/2 rounded-full blur-2xl ${glowClassName}`}
              style={{ x: glowX, y: glowY, willChange: 'transform' }}
              animate={{ opacity: isHovering ? 0.8 : 0 }}
              transition={{ duration: 0.28, ease: REVEAL_EASE }}
            />
            <motion.div
              className="pointer-events-none absolute inset-0 rounded-[inherit] border border-white/[0.24]"
              animate={{ opacity: isHovering ? 1 : 0.45 }}
              transition={{ duration: 0.28, ease: REVEAL_EASE }}
            />
            {children}
          </motion.div>
        );
      }

      function PartnerMarquee({ items }) {
        const trackRef = useRef(null);
        const loopWidth = useRef(0);
        const x = useMotionValue(0);
        const [isHovering, setIsHovering] = useState(false);
        const speedRef = useRef(34);

        useEffect(() => {
          const measure = () => {
            if (!trackRef.current) return;
            loopWidth.current = trackRef.current.scrollWidth / 2;
          };

          measure();

          if (trackRef.current && typeof ResizeObserver !== 'undefined') {
            const observer = new ResizeObserver(measure);
            observer.observe(trackRef.current);
            return () => observer.disconnect();
          }
        }, []);

        useAnimationFrame((_, delta) => {
          if (!loopWidth.current) return;
          const target = isHovering ? 0 : 34;
          speedRef.current += (target - speedRef.current) * 0.08;
          let next = x.get() - speedRef.current * (delta / 1000);

          if (next <= -loopWidth.current) {
            next += loopWidth.current;
          }

          x.set(next);
        });

        const looped = [...items, ...items];

        return (
          <div
            className="overflow-hidden rounded-2xl border border-black/5 bg-transparent py-6"
            onMouseEnter={() => setIsHovering(true)}
            onMouseLeave={() => setIsHovering(false)}
          >
            <motion.div ref={trackRef} style={{ x, willChange: 'transform' }} className="flex w-max items-center gap-6 py-2">
              {looped.map((partner, index) => {
                const isDarkBadge = partner.name === 'iHub Nairobi' || partner.name === 'Suluhu Studio';
                const isLarge = partner.name === 'Strathmore University';
                const isIhub = partner.name === 'iHub Nairobi';
                const isSuluhu = partner.name === 'Suluhu Studio';
                const imgClasses = isLarge
                  ? 'mx-auto block max-h-28 w-[180px] object-contain object-center'
                  : isIhub
                    ? 'mx-auto block max-h-[84px] w-auto object-contain object-center'
                    : isSuluhu
                      ? 'mx-auto block max-h-[52px] w-auto object-contain object-center'
                      : 'mx-auto block max-h-16 w-auto object-contain object-center';

                return (
                  <div
                    key={`${partner.name || partner}-${index}`}
                    className={`mx-2 grid h-24 place-items-center rounded-[1.5rem] px-4 py-3 text-center shadow-[0_12px_28px_rgba(0,0,0,0.06)] ${isLarge ? 'min-w-[250px] w-[250px]' : 'min-w-[190px]'} ${isDarkBadge ? 'border border-[#1a1a1a] bg-[#0d0d0d]' : 'bg-transparent'}`}
                    style={{
                      background: isDarkBadge ? 'linear-gradient(135deg, #0c0c0c 0%, #191919 100%)' : 'transparent',
                    }}
                  >
                    {partner.svg ? (
                      <span className="inline-flex max-h-16 w-full items-center justify-center" dangerouslySetInnerHTML={{ __html: partner.svg }} />
                    ) : partner.src ? (
                      <div className="flex w-full items-center justify-center">
                        <img
                          src={partner.src}
                          alt={partner.name}
                          className={imgClasses}
                          style={{
                            filter: isDarkBadge ? 'drop-shadow(0 8px 18px rgba(255,255,255,0.08))' : 'drop-shadow(0 8px 18px rgba(17,17,17,0.08))',
                            margin: '0 auto',
                            display: 'block',
                            objectPosition: 'center center',
                          }}
                        />
                      </div>
                    ) : (
                      <span className="text-lg font-semibold tracking-wide text-black/[0.7]">{partner.name || partner}</span>
                    )}
                  </div>
                );
              })}
            </motion.div>
          </div>
        );
      }

      function VideoModal({ event, onClose }) {
        if (!event) return null;
        const [hasVideoError, setHasVideoError] = useState(false);
        const [resolvedSrc, setResolvedSrc] = useState(null);
        const [loadError, setLoadError] = useState(false);

        useEffect(() => {
          let isActive = true;
          let objectUrl = null;

          setResolvedSrc(event.playerType === 'file' ? null : event.embedUrl);
          setLoadError(false);

          if (event.playerType !== 'file') {
            return () => {
              isActive = false;
            };
          }

          fetch(event.videoSrc)
            .then((response) => {
              if (!response.ok) throw new Error(`Failed to load video: ${response.status}`);
              return response.blob();
            })
            .then((blob) => {
              if (!isActive) return;
              const mimeType = event.videoSrc.endsWith('.webm') ? 'video/webm' : 'video/mp4';
              objectUrl = URL.createObjectURL(new Blob([blob], { type: mimeType }));
              setResolvedSrc(objectUrl);
            })
            .catch(() => {
              if (isActive) setResolvedSrc(event.videoSrc);
            });

          return () => {
            isActive = false;
            if (objectUrl) URL.revokeObjectURL(objectUrl);
          };
        }, [event.embedUrl, event.playerType, event.videoSrc]);

        return (
          <div
            className="fixed inset-0 z-[80] flex items-center justify-center bg-black/80 px-4 backdrop-blur-md"
            onClick={onClose}
          >
            <div
              className="relative w-full max-w-5xl overflow-hidden rounded-[2rem] border border-white/15 bg-[#0b0b0f] shadow-[0_40px_120px_rgba(0,0,0,0.7)]"
              onClick={(e) => e.stopPropagation()}
            >
              <div className="flex items-center justify-between border-b border-white/10 px-5 py-4 text-white/80">
                <div>
                  <p className="text-[10px] uppercase tracking-[0.22em] text-white/60">Featured event</p>
                  <h3 className="mt-1 text-lg font-medium text-white">{event.title}</h3>
                </div>
                <button
                  type="button"
                  onClick={onClose}
                  className="flex h-9 w-9 items-center justify-center rounded-full border border-white/15 bg-white/5 text-lg text-white/80 transition hover:bg-white/10 hover:text-white"
                  aria-label="Close video"
                >
                  ×
                </button>
              </div>

              <div className="aspect-video w-full bg-black">
                {event.playerType === 'file' && resolvedSrc && !loadError ? (
                  <video
                    className="h-full w-full bg-black object-cover"
                    src={resolvedSrc}
                    poster={event.poster}
                    controls
                    autoPlay
                    playsInline
                    preload="auto"
                    muted={false}
                    defaultMuted={false}
                    onLoadedMetadata={(loadedEvent) => {
                      loadedEvent.currentTarget.muted = false;
                      loadedEvent.currentTarget.defaultMuted = false;
                      loadedEvent.currentTarget.volume = 1;
                    }}
                    onError={() => {
                      if (resolvedSrc && resolvedSrc.startsWith('blob:')) {
                        setResolvedSrc(event.videoSrc);
                      } else {
                        setLoadError(true);
                      }
                    }}
                  />
                ) : event.playerType === 'file' && !loadError ? (
                  <div className="flex h-full items-center justify-center bg-gradient-to-br from-[#101010] via-[#1a1a1a] to-[#070707] px-8 text-center text-white">
                    <div>
                      <p className="text-[10px] uppercase tracking-[0.22em] text-white/60">Loading video</p>
                      <p className="mt-3 text-lg text-white/80">Preparing playback...</p>
                    </div>
                  </div>
                ) : event.playerType === 'file' ? (
                  <div className="flex h-full flex-col items-center justify-center gap-5 bg-gradient-to-br from-[#101010] via-[#1a1a1a] to-[#070707] px-8 text-center text-white">
                    <div className="max-w-md">
                      <p className="text-[10px] uppercase tracking-[0.22em] text-white/60">Video unavailable</p>
                      <h4 className="mt-3 text-2xl font-medium text-white">{event.title}</h4>
                      <p className="mt-4 text-sm leading-7 text-white/72">
                        The browser could not load this clip directly. The file is still available in the project media
                        folder.
                      </p>
                    </div>
                  </div>
                ) : (
                  <iframe
                    className="h-full w-full"
                    src={event.embedUrl}
                    title={event.title}
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    referrerPolicy="strict-origin-when-cross-origin"
                    allowFullScreen
                  />
                )}
              </div>
            </div>
          </div>
        );
      }

      function PortfolioMarquee({ events, onSelect }) {
        const [pageIndex, setPageIndex] = useState(0);
        const eventsPerPage = 2;
        const totalPages = Math.max(1, Math.ceil(events.length / eventsPerPage));
        const currentEvents = events.slice(pageIndex * eventsPerPage, pageIndex * eventsPerPage + eventsPerPage);

        const goPrevious = () => {
          setPageIndex((current) => (current === 0 ? totalPages - 1 : current - 1));
        };

        const goNext = () => {
          setPageIndex((current) => (current + 1) % totalPages);
        };

        return (
          <div className="space-y-5">
            <div className="flex items-center justify-end gap-3">
              <button
                type="button"
                onClick={goPrevious}
                className="inline-flex h-11 w-11 items-center justify-center rounded-full border border-white/15 bg-white/5 text-white transition hover:border-white/30 hover:bg-white/10"
                aria-label="Show previous portfolio items"
              >
                <span aria-hidden="true">←</span>
              </button>
              <button
                type="button"
                onClick={goNext}
                className="inline-flex h-11 w-11 items-center justify-center rounded-full border border-white/15 bg-white/5 text-white transition hover:border-white/30 hover:bg-white/10"
                aria-label="Show next portfolio items"
              >
                <span aria-hidden="true">→</span>
              </button>
            </div>

            <div className="grid gap-6 md:grid-cols-2">
              {currentEvents.map((event, index) => (
                <article
                  key={`${event.title}-${pageIndex}-${index}`}
                  onClick={() => onSelect(event)}
                  className={`group cursor-pointer overflow-hidden rounded-[2rem] border border-white/[0.12] bg-[#101010] shadow-[0_22px_45px_rgba(0,0,0,0.35)] transition hover:brightness-110 ${event.tilt}`}
                >
                  <div className="relative h-[360px] overflow-hidden bg-[#0b0b0f]">
                    {event.poster ? (
                      <>
                        <img
                          src={event.poster}
                          alt={event.title}
                          className="h-full w-full object-cover transition duration-500 group-hover:scale-105"
                        />
                        <div className="absolute inset-0 bg-[linear-gradient(180deg,rgba(0,0,0,0.16),rgba(0,0,0,0.72))]" />
                      </>
                    ) : (
                      <>
                        <div className={`flex h-full w-full flex-col justify-between bg-gradient-to-br ${event.tone} px-6 py-6`}>
                          <div className="flex items-center justify-between text-[10px] uppercase tracking-[0.22em] text-white/70">
                            <span>Portfolio preview</span>
                            <span>{event.year}</span>
                          </div>
                          <div>
                            <p className="max-w-sm text-3xl font-medium leading-tight text-white">{event.title}</p>
                            <p className="mt-3 text-sm text-white/75">{event.location}</p>

      :root {
        color-scheme: dark;

      html,

        margin: 0;
        padding: 0;

        background: #060606;

      body {
        animation: none;

      @keyframes page-enter {
        from {
          opacity: 0;
          transform: translateY(12px);

        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);

          border-color 420ms cubic-bezier(0.16, 1, 0.3, 1),

        overflow: hidden;

  .hero-radiance {

      #reactMobileNav .nav-close:active { transform:scale(.9); }
      #reactMobileNav .nav-link { display:flex; align-items:center; justify-content:space-between; padding:15px 2px; font-size:17px; font-weight:500; color:rgba(245,239,231,.8); text-decoration:none; border-bottom:1px solid rgba(245,239,231,.08); }

      /* Premium interaction language */

      @media (prefers-reduced-motion: reduce) { :where(a, button, article, .premium-card), .service-grid > div { transition: none !important; animation: none !important; transform: none !important; } }

  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="text/babel">
      const { useEffect, useRef, useState } = React;
      const { motion, AnimatePresence, useAnimationFrame, useMotionTemplate, useMotionValue, useScroll, useSpring, useTransform } = window.Motion;

      const REVEAL_EASE = [0.16, 1, 0.3, 1];
      const REVEAL_TRANSITION = { duration: 0.72, ease: REVEAL_EASE };
      const SECTION_REVEAL = {
        initial: { opacity: 0, y: 30 },
        whileInView: { opacity: 1, y: 0 },
        viewport: { once: true, amount: 0.2 },
        transition: REVEAL_TRANSITION,
      };
      const STAGGER_CONTAINER = {
        hidden: {},
        show: {
          transition: {
            staggerChildren: 0.15,
          },
        },
      };
      const STAGGER_ITEM = {
        hidden: { opacity: 0, y: 30 },
        show: { opacity: 1, y: 0, transition: REVEAL_TRANSITION },
      };

      function MagneticButton({ href, className, children, target, rel }) {
        const x = useMotionValue(0);
        const y = useMotionValue(0);
        const springX = useSpring(x, { stiffness: 280, damping: 26, mass: 0.3 });
        const springY = useSpring(y, { stiffness: 280, damping: 26, mass: 0.3 });

        const handleMouseMove = (event) => {
          const rect = event.currentTarget.getBoundingClientRect();
          const dx = event.clientX - (rect.left + rect.width / 2);
          const dy = event.clientY - (rect.top + rect.height / 2);
          x.set(Math.max(-10, Math.min(10, dx * 0.12)));
          y.set(Math.max(-8, Math.min(8, dy * 0.16)));
        };

        const reset = () => {
          x.set(0);
          y.set(0);
        };

        return (
          <motion.a
            href={href}
            target={target}
            rel={rel}
            style={{ x: springX, y: springY, willChange: 'transform' }}
            whileTap={{ scale: 0.97 }}
            transition={{ type: 'spring', stiffness: 540, damping: 34, mass: 0.5 }}
            onMouseMove={handleMouseMove}
            onMouseLeave={reset}
            className={`premium-button ${className}`}
          >
            {children}
          </motion.a>
        );
      }

      function AnimatedStat({ value, suffix = '', label }) {
        const elementRef = useRef(null);
        const [displayValue, setDisplayValue] = useState(0);
        const [started, setStarted] = useState(false);

        useEffect(() => {
          const observer = new IntersectionObserver(([entry]) => {
            if (entry.isIntersecting) setStarted(true);
          }, { threshold: 0.45 });
          if (elementRef.current) observer.observe(elementRef.current);
          return () => observer.disconnect();
        }, []);

        useEffect(() => {
          if (!started) return;
          const duration = 1350;
          const startTime = performance.now();
          let frame;
          const tick = (now) => {
            const progress = Math.min((now - startTime) / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 4);
            setDisplayValue(Math.round(value * eased));
            if (progress < 1) frame = requestAnimationFrame(tick);
          };
          frame = requestAnimationFrame(tick);
          return () => cancelAnimationFrame(frame);
        }, [started, value]);

        return (
          <div ref={elementRef}>
            <SpotlightPanel
              className="rounded-2xl border border-white/10 bg-[linear-gradient(180deg,rgba(14,14,14,0.55),rgba(255,255,255,0.02))] p-5 shadow-[0_10px_24px_rgba(0,0,0,0.18)] backdrop-blur-sm"
              glowClassName="bg-[#db5d11]/[0.4]"
              hoverLift
            >
              <p className="font-display text-5xl leading-none text-white sm:text-7xl">{displayValue.toLocaleString()}{suffix}</p>
              <p className="mt-4 text-[10px] font-bold uppercase tracking-[0.22em] text-white/75">{label}</p>
            </SpotlightPanel>
          </div>
        );
      }

      function SpotlightPanel({ className, children, glowClassName = 'bg-white/[0.1]', hoverLift = false }) {
        const [isHovering, setIsHovering] = useState(false);
        const x = useMotionValue(-200);
        const y = useMotionValue(-200);
        const glowX = useSpring(x, { stiffness: 260, damping: 28, mass: 0.35 });
        const glowY = useSpring(y, { stiffness: 260, damping: 28, mass: 0.35 });

        const onMove = (event) => {
          const rect = event.currentTarget.getBoundingClientRect();
          x.set(event.clientX - rect.left);
          y.set(event.clientY - rect.top);
        };

        return (
          <motion.div
            className={`relative overflow-hidden ${className}`}
            onMouseMove={onMove}
            onMouseEnter={() => setIsHovering(true)}
            onMouseLeave={() => setIsHovering(false)}
            whileHover={hoverLift ? { y: -8, scale: 1.012 } : undefined}
            transition={hoverLift ? { type: 'spring', stiffness: 320, damping: 24, mass: 0.55 } : undefined}
          >
            <motion.div
              className={`pointer-events-none absolute h-56 w-56 -translate-x-1/2 -translate-y-1/2 rounded-full blur-2xl ${glowClassName}`}
              style={{ x: glowX, y: glowY, willChange: 'transform' }}
              animate={{ opacity: isHovering ? 0.8 : 0 }}
              transition={{ duration: 0.28, ease: REVEAL_EASE }}
            />
            <motion.div
              className="pointer-events-none absolute inset-0 rounded-[inherit] border border-white/[0.24]"
              animate={{ opacity: isHovering ? 1 : 0.45 }}
              transition={{ duration: 0.28, ease: REVEAL_EASE }}
            />
            {children}
          </motion.div>
        );
      }

      function PartnerMarquee({ items }) {
        const trackRef = useRef(null);
        const loopWidth = useRef(0);
        const x = useMotionValue(0);
        const [isHovering, setIsHovering] = useState(false);
        const speedRef = useRef(34);

        useEffect(() => {
          const measure = () => {
            if (!trackRef.current) return;
            loopWidth.current = trackRef.current.scrollWidth / 2;
          };

          measure();

          if (trackRef.current && typeof ResizeObserver !== 'undefined') {
            const observer = new ResizeObserver(measure);
            observer.observe(trackRef.current);
            return () => observer.disconnect();
          }
        }, []);

        useAnimationFrame((_, delta) => {
          if (!loopWidth.current) return;
          const target = isHovering ? 0 : 34;
          speedRef.current += (target - speedRef.current) * 0.08;
          let next = x.get() - speedRef.current * (delta / 1000);

          if (next <= -loopWidth.current) {
            next += loopWidth.current;
          }

          x.set(next);
        });

        const looped = [...items, ...items];

        return (
          <div
            className="overflow-hidden bg-transparent py-6"
            onMouseEnter={() => setIsHovering(true)}
            onMouseLeave={() => setIsHovering(false)}
            style={{
              WebkitMaskImage: 'linear-gradient(to right, transparent, black 8%, black 92%, transparent)',
              maskImage: 'linear-gradient(to right, transparent, black 8%, black 92%, transparent)',
            }}
          >
            <motion.div ref={trackRef} style={{ x, willChange: 'transform' }} className="flex w-max items-center gap-16 py-2 pl-6 md:gap-20">
              {looped.map((partner, index) => {
                const isLarge = partner.name === 'Strathmore University';
                const isIhub = partner.name === 'iHub Nairobi';
                const isSuluhu = partner.name === 'Suluhu Studio';
                const isHackhouse = partner.name === 'HackHouse';
                const isHeartSpark = partner.name === 'HeartSpark Consultancy';
                const isAmericanSpaces = partner.name === 'American Spaces';
                const imgClasses = isLarge
                  ? 'mx-auto block h-28 w-auto max-w-[300px] object-contain object-center'
                  : isIhub
                    ? 'mx-auto block h-24 w-auto object-contain object-center'
                    : isSuluhu
                      ? 'mx-auto block h-7 w-auto object-contain object-center'
                      : isHackhouse
                        ? 'mx-auto block h-auto w-full max-w-[135px] object-contain object-center'
                        : isHeartSpark
                          ? 'mx-auto block h-20 w-auto object-contain object-center'
                          : isAmericanSpaces
                            ? 'mx-auto block h-20 w-auto object-contain object-center'
                            : 'mx-auto block h-12 w-auto object-contain object-center';

                return (
                  <div
                    key={`${partner.name || partner}-${index}`}
                    className="relative flex h-28 items-center justify-center"
                  >
                    {partner.svg ? (
                      <span className="inline-flex h-14 items-center justify-center" dangerouslySetInnerHTML={{ __html: partner.svg }} />
                    ) : partner.src ? (
                      <img
                        src={partner.src}
                        alt={partner.name}
                        className={imgClasses}
                        style={{
                          filter: isIhub ? 'invert(1)' : 'none',
                          display: 'block',
                          objectPosition: 'center center',
                        }}
                      />
                    ) : (
                      <span className="text-lg font-semibold tracking-wide text-black/[0.7]">{partner.name || partner}</span>
                    )}
                  </div>
                );
              })}
            </motion.div>
          </div>
        );
      }

      const brandGuidelines = {
        crevia: {
          name: 'Crevia',
          eyebrow: 'Brand Identity',
          description:
            "Crevia's identity is built to do one job: make authority feel earned, not asserted. Every weight, mark, and color choice exists to hold a brand's story with the same clarity we ask our clients to bring to theirs.",
          logo: 'crevia/images/digital%20spaces/crevia%20logo.PNG',
          logoBg: '#000000',
          fonts: [
            { name: 'Libre Baskerville', family: "'Libre Baskerville', serif", role: 'Display / Headlines' },
            { name: 'Poppins', family: "'Poppins', sans-serif", role: 'Body / UI' },
          ],
          colors: ['#000000', '#FFFFFF', '#DB5D11'],
          mockups: [
            { key: 'bottle', label: 'Packaging', aspectStyle: { aspectRatio: '1083 / 1452' }, render: () => <img src="crevia/images/digital%20spaces/crevia%20logo%20on%20bottle.png" alt="Crevia branded bottles" style={{ display: 'block', width: '100%', height: '100%', objectFit: 'cover' }} /> },
          ],
        },
        mzizi: {
          name: 'Mzizi Organics',
          eyebrow: 'Brand Identity',
          description:
            "Mzizi's identity carries its philosophy in its shape: nourish the root, and everything above it flourishes. The mark, type, and color are all built to feel earthen, warm, and unmistakably premium on the shelf.",
          logo: 'crevia/images/digital%20spaces/mzizi%20organics%20logo.PNG',
          logoBg: '#4e0219',
          fonts: [
            { name: 'Shrikhand', family: "'Shrikhand', cursive", role: 'Display / Wordmark' },
            { name: 'Poppins', family: "'Poppins', sans-serif", role: 'Body / UI' },
          ],
          colors: ['#FFFFFF', '#5D0A1C'],
          mockups: [
            { key: 'bottle', label: 'Packaging', render: () => <img src="crevia/images/digital%20spaces/mzizi%20organics%20bottle.png" alt="Mzizi Organics bottle" className="h-full w-full object-cover" /> },
          ],
        },
      };

      function BrandGuidelinesModal({ brand, onClose }) {
        if (!brand) return null;
        return (
          <div
            className="fixed inset-0 z-[90] flex items-center justify-center bg-black/75 px-4 py-8 backdrop-blur-md"
            onClick={onClose}
          >
            <div
              className="relative flex max-h-[88vh] w-full max-w-4xl flex-col overflow-hidden rounded-[2rem] bg-[#faf7f2] shadow-[0_60px_140px_rgba(0,0,0,0.55)]"
              onClick={(e) => e.stopPropagation()}
            >
              <div className="flex items-center justify-between border-b border-black/[0.06] bg-[#faf7f2]/95 px-8 py-5 backdrop-blur sm:px-12">
                <div>
                  <p className="text-[10px] font-bold uppercase tracking-[0.32em] text-ember">{brand.eyebrow}</p>
                  <h2 className="mt-1 font-display text-2xl text-[#17110d] sm:text-3xl">{brand.name}</h2>
                </div>
                <button
                  type="button"
                  onClick={onClose}
                  className="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-black/10 text-[#17110d] transition hover:border-black/20 hover:bg-black/[0.03]"
                  aria-label="Close"
                >
                  ✕
                </button>
              </div>

              <div className="overflow-y-auto px-8 py-10 sm:px-12 sm:py-12">
                <p className="max-w-2xl text-lg leading-8 text-[#17110d]/70">{brand.description}</p>

                <div className="mt-10 overflow-hidden rounded-[1.5rem]" style={{ background: brand.logoBg }}>
                  <div className="flex min-h-[220px] items-center justify-center px-12 py-16 sm:min-h-[260px]">
                    <img
                      src={brand.logo}
                      alt={`${brand.name} logo`}
                      className="h-auto max-h-32 w-auto max-w-[65%] object-contain sm:max-h-36"
                    />
                  </div>
                </div>

                <div className="mt-12">
